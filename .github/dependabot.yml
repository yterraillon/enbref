version: 2
updates:
  # Serveur .NET — versions centralisées dans server/Directory.Packages.props
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: monthly
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      nuget-major:
        patterns: ["*"]
        update-types: [major]

  # Image de base du serveur
  - package-ecosystem: docker
    directory: /server/src/Api
    schedule:
      interval: monthly
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

# Pas d'écosystème npm : le site de web/ est en HTML/CSS statique, sans build ni
# dépendances (voir web/.claude/CLAUDE.md). Si un package.json apparaît un jour,
# c'est que la décision a changé — et elle passe par un ADR.

name: Serveur — build

on:
  push:
    branches-ignore: [main]   # main est couvert par release-server.yml
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'

concurrency:
  group: build-server-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore enbref.server.slnx
        working-directory: ./server

      - name: Build
        run: dotnet build enbref.server.slnx --no-restore --configuration Release
        working-directory: ./server

      # Pas d'étape `test` : aucun projet de test n'est encore porté depuis myfanwy.
      # À rétablir dès le premier projet sous server/tests/.

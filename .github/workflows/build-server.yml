name: Serveur — build

on:
  push:
    branches-ignore: [main]   # main est couvert par release-server.yml
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'

concurrency:
  group: build-server-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json

      - name: Restore
        run: dotnet restore enbref.server.slnx
        working-directory: ./server

      - name: Build
        run: dotnet build enbref.server.slnx --no-restore --configuration Release
        working-directory: ./server

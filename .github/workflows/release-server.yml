name: Serveur — publication de l'image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/release-server.yml'
  workflow_dispatch:

concurrency:
  group: release-server
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/enbref-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute CalVer version
        run: |
          DATE=$(date -u +%Y.%m.%d)
          LAST=$(git tag -l "$DATE.*" | sort -V | tail -n1)
          if [ -z "$LAST" ]; then N=1; else N=$((10#${LAST##*.} + 1)); fi
          VERSION=$(printf '%s.%02d' "$DATE" "$N")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: Create GitHub Deployment
        run: |
          RESPONSE=$(curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments \
            -d '{"ref": "${{ github.sha }}", "environment": "production", "auto_merge": false}')
          echo "DEPLOYMENT_ID=$(echo $RESPONSE | jq -r '.id')" >> $GITHUB_ENV

      - name: Set Deployment Status to in_progress
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ env.DEPLOYMENT_ID }}/statuses \
            -d '{"state": "in_progress"}'

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/src/Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          build-args: VERSION=${{ env.VERSION }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --notes "Docker image: \`${{ env.REGISTRY }}/${{ env.IMAGE }}:$VERSION\`"

      - name: Set Deployment Status to success
        if: success()
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ env.DEPLOYMENT_ID }}/statuses \
            -d '{"state": "success"}'

      - name: Set Deployment Status to failure
        if: failure()
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ env.DEPLOYMENT_ID }}/statuses \
            -d '{"state": "failure"}'

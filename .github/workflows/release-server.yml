name: Serveur — release

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'design-system/**'
      - '.github/workflows/release-server.yml'
  workflow_dispatch:

concurrency:
  group: release-server
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/enbref-server

jobs:
  release:
    name: Image, version et release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CalVer YYYY.MM.DD.NN (ADR-004) : NN s'incrémente sur les tags du jour.
      - name: Calcul de la version
        run: |
          DATE=$(date -u +%Y.%m.%d)
          LAST=$(git tag -l "$DATE.*" | sort -V | tail -n1)
          if [ -z "$LAST" ]; then N=1; else N=$((10#${LAST##*.} + 1)); fi
          VERSION=$(printf '%s.%02d' "$DATE" "$N")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version : $VERSION"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server/src/Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          build-args: APP_VERSION=${{ env.VERSION }}

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --notes "Image Docker : \`${{ env.REGISTRY }}/${{ env.IMAGE }}:$VERSION\`"

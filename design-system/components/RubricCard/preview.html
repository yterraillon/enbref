   {title:'Scrutin municipal : la réforme validée en commission', body:"La commission des lois du Sénat a approuvé l'extension du scrutin de liste aux communes de moins de 1 000 habitants."}]}),
 h(E.RubricCard, {name:'International', defaultRead:true, items:[]})));

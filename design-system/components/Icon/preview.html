<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — EnBref</title>
<style>html,body{margin:0;background:var(--bg-grouped)}</style></head>
<body>
<div id="root" class="eb-root eb-screen"></div>
<script>
  var E = window.EnBref, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'flex',gap:28,alignItems:'center',padding:'0 16px',color:'var(--label)'}},
  ['play','pause','skip-forward','check','chevron-right','chevron-up','chevron-down'].map(function(n){return h(E.Icon,{key:n,name:n,size:18});})));
</script>
</body>
</html>

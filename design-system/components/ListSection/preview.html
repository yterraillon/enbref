<div id="root" class="eb-root eb-screen"></div>
<script>
  var E = window.EnBref, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(E.ListSection, {header:'Réception', footer:"La notification arrive chaque jour à cette heure, même en mode Concentration Sommeil si vous l'autorisez."},
  h(E.ListRow, {title:'Heure du récap', value:'7:30', onClick:function(){}}),

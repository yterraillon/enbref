<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — EnBref</title>
<style>html,body{margin:0;background:var(--bg-grouped)}</style></head>
<body>
<div id="root" class="eb-root eb-screen"></div>
<script>
  var E = window.EnBref, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'flex',flexDirection:'column',gap:16,padding:'0 16px'}},
  h(E.Button, {icon:'play', block:true}, 'Écouter le récap'),
  h('div', {style:{display:'flex',gap:24,alignItems:'center'}},
    h(E.Button, {icon:'pause'}, 'Pause'),
    h(E.Button, {variant:'plain'}, 'Activer'),
    h(E.Button, {disabled:true}, 'Indisponible'))));
</script>
</body>
</html>
